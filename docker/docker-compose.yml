services:
  surge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: surge:local
    container_name: surge
    env_file:
      - ../.env
    volumes:
      - surge_data:/app/data
    restart: unless-stopped
    # Default: scheduler mode (portfolio + radar diários). Override for one-off scan:
    # command: ["surge", "scan", "--portfolio"]
    # command: ["surge", "scan", "--radar"]

volumes:
  surge_data:
